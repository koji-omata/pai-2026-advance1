services:
  pai_ros2:
    image: airobotbook/ros2-desktop-ai-robot-book-humble:latest
    container_name: pai_ros2

    privileged: true
    shm_size: 512m
    restart: unless-stopped

    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}

      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

      RESOLUTION: 1920x1080

      PULSE_COOKIE: /tmp/pulse/cookie
      PULSE_SERVER: unix:/tmp/pulse/native

    ports:
      - "15900:5900"
      - "13389:3389"
      - "9090:9090"
      - "9876:9876"
      - "6080:80"

    volumes:
      - ./workspace:/workspace
      - /run/user/${UID:-1000}/pulse/native:/tmp/pulse/native
      - ${HOME:-~}/.config/pulse/cookie:/tmp/pulse/cookie:ro

    stdin_open: true
    tty: true
